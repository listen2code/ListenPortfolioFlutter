# DartDoc Configuration
# This file configures the dartdoc tool for generating API documentation

# Header and footer customization
header: |
  <div class="header">
    <h1>Listen Portfolio Flutter API Documentation</h1>
    <p>Comprehensive API documentation for the Listen Portfolio Flutter application and its core libraries.</p>
    <div class="header-links">
      <a href="https://github.com/listen2code/ListenPortfolioFlutter">GitHub Repository</a>
      <a href="https://pub.dev/packages/listen_core">listen_core on pub.dev</a>
      <a href="https://pub.dev/packages/listen_uikit">listen_uikit on pub.dev</a>
    </div>
  </div>

footer: |
  <div class="footer">
    <p>Generated by <a href="https://dart.dev/tools/dart-doc">dartdoc</a></p>
    <p>&copy; 2026 Listen Portfolio Flutter. All rights reserved.</p>
    <div class="footer-links">
      <a href="https://listen2code.github.io">Author Website</a>
      <a href="mailto:listen2code@gmail.com">Contact</a>
    </div>
  </div>

# Custom categories for better organization
categories:
  # Core Architecture
  core:
    title: "Core Architecture"
    description: "Fundamental architecture components and base classes"
    subcategories:
      base:
        title: "Base Classes"
        description: "Base classes for ViewModels, Repositories, and Use Cases"
      network:
        title: "Network Layer"
        description: "HTTP client, API interfaces, and network utilities"
      utils:
        title: "Core Utilities"
        description: "Utility classes and helpers"
  
  # Shared Components
  shared:
    title: "Shared Components"
    description: "Business logic and shared utilities"
    subcategories:
      constants:
        title: "Constants"
        description: "Application constants and configuration"
      extensions:
        title: "Extensions"
        description: "Dart extension methods"
      utils:
        title: "Utilities"
        description: "Shared utility functions"
  
  # UI Components
  uikit:
    title: "UI Components"
    description: "Reusable UI components and design system"
    subcategories:
      widgets:
        title: "Widgets"
        description: "Custom Flutter widgets"
      themes:
        title: "Themes"
        description: "Theme configurations and styling"
  
  # Features
  features:
    title: "Feature Modules"
    description: "Application feature modules"
    subcategories:
      auth:
        title: "Authentication"
        description: "User authentication and authorization"
      home:
        title: "Home"
        description: "Home screen and overview features"
      settings:
        title: "Settings"
        description: "Application settings and configuration"

# Link customization
linkResolution:
  # Resolve links to external packages
  external:
    'package:flutter/material.dart': 'https://api.flutter.dev/flutter/material/material-library.html'
    'package:flutter_riverpod/flutter_riverpod.dart': 'https://pub.dev/documentation/flutter_riverpod/latest/flutter_riverpod/flutter_riverpod-library.html'
    'package:fpdart/fpdart.dart': 'https://pub.dev/documentation/fpdart/latest/fpdart/fpdart-library.html'
    'package:dio/dio.dart': 'https://pub.dev/documentation/dio/latest/dio/dio-library.html'
    'package:freezed_annotation/freezed_annotation.dart': 'https://pub.dev/documentation/freezed_annotation/latest/freezed_annotation/freezed_annotation-library.html'

# Exclude patterns
exclude:
  # Generated files
  - '**/*.g.dart'
  - '**/*.freezed.dart'
  - '**/*.mock.dart'
  
  # Test files
  - '**/test/**'
  - '**/*_test.dart'
  
  # Implementation details
  - '**/impl/**'
  - '**/*_impl.dart'
  
  # Private files
  - '**/_private/**'
  - '**/*_private.dart'

# Include patterns (more specific than exclude)
include:
  # Core library files
  - 'lib/core/**'
  
  # Shared components
  - 'lib/shared/**'
  
  # UI components
  - 'lib/uikit/**'
  
  # Feature domain layer (clean architecture)
  - 'lib/features/**/domain/**'
  - 'lib/features/**/presentation/**'

# Additional configuration for pub.dev publishing
pubDev:
  # Package information for listen_core
  listen_core:
    description: "Core utilities and base classes for Flutter applications"
    homepage: "https://github.com/listen2code/ListenCore"
    documentation: "https://pub.dev/documentation/listen_core/latest"
    
  # Package information for listen_uikit  
  listen_uikit:
    description: "Design system and reusable UI components for Flutter applications"
    homepage: "https://github.com/listen2code/ListenUiKit"
    documentation: "https://pub.dev/documentation/listen_uikit/latest"
