name: listen_portfolio_flutter
description: "Portfolio of Listen"
publish_to: 'none'

version: 1.1.0
desc: "Release 1.1.0"
desc_zh: ""
desc_ja: ""

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  listen_core: ^0.0.45
  listen_uikit: ^0.0.22
  dynamic_color: ^1.8.1

  # Firebase & Notifications
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1
  app_links: ^6.3.3

  # In-App Purchase
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.1

  # UI
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2

  # Functional Programming
  fpdart: ^1.1.0

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Utilities
  logger: ^2.6.2
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  quick_actions: ^1.0.10
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  flutter_inappwebview: ^6.1.5
  in_app_review: ^2.0.9

  # Routing
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  permission_handler: ^12.0.1

  # Image handling
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  uuid: ^4.5.3
  share_plus: ^13.2.0
  visibility_detector: ^0.4.0+2
  flutter_markdown_plus: ^1.0.1
  markdown: ^7.3.0
  printing: ^5.13.0

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4
  
  # Documentation
  dartdoc: ^9.0.0
  
  # Custom Lint Rules
  custom_lint: 0.8.1
  dependency_lint_rules:
    path: tools/lint_rules

  # Code Generation
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.0+1
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.3
  http_mock_adapter: ^0.6.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher_adaptive_fore.png"
  adaptive_icon_background: "#448AFF"
  adaptive_icon_foreground: "assets/images/ic_launcher_adaptive_fore.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/v1/delete/user/
    - assets/mock/v1/get/
    - assets/mock/v1/post/
    - assets/mock/v1/post/auth/
    - assets/mock/v1/post/user/
    - assets/mock/v1/post/ai/
    - assets/mock/images/
    - assets/html/
flutter_assets_generator:
  output_dir: generated/
  output_filename: r
  class_name: R
  auto_detection: true
  # Automatically add missing dependencies (rive, flutter_svg, lottie) default: true
  auto_add_dependencies: true
  # Options: robust (default), legacy (old style)
  style: legacy
  package_parameter_enabled: false
  named_with_parent: true
  path_ignore: [ ]

