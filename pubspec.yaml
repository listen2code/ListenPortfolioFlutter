name: listen_portfolio_flutter
description: "Portfolio of Listen"
publish_to: 'none'

version: 1.0.10

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  listen_core: ^0.0.1
  listen_uikit: ^0.0.1

  # UI
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2

  # Functional Programming
  fpdart: ^1.1.0

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Utilities
  logger: ^2.6.2
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  quick_actions: ^1.0.10
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

  # Routing
  go_router: ^17.0.1
  equatable: ^2.0.8
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  permission_handler: ^12.0.1

  # Image handling
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  uuid: ^4.5.3
  share_plus: ^12.0.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.0+1
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.3
  http_mock_adapter: ^0.6.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher_adaptive_fore.png"
  adaptive_icon_background: "#448AFF"
  adaptive_icon_foreground: "assets/images/ic_launcher_adaptive_fore.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/v1/delete/
    - assets/mock/v1/delete/auth/
    - assets/mock/v1/get/
    - assets/mock/v1/post/
    - assets/mock/v1/post/auth/
    - assets/mock/v1/put/
    - assets/mock/resource/images/
