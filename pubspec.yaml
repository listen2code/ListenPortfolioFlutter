name: listen_portfolio_flutter
description: "Portfolio of Listen"
publish_to: 'none'

version: 1.0.16
desc: "Improve notification permission timing and unify cold-start/background click routing"
desc_zh: "优化通知权限请求时机，统一冷启动与后台点击的路由跳转逻辑"
desc_ja: "通知権限リクエストのタイミングを最適化し、コールドスタートとバックグラウンドクリックのルーティングを統一"

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  listen_core: ^0.0.9
  listen_uikit: ^0.0.8
  dynamic_color: ^1.8.1

  # Firebase & Notifications
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1

  # UI
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2

  # Functional Programming
  fpdart: ^1.1.0

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Utilities
  logger: ^2.6.2
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  quick_actions: ^1.0.10
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0

  # Routing
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  permission_handler: ^12.0.1

  # Image handling
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  uuid: ^4.5.3
  share_plus: ^13.1.0
  visibility_detector: ^0.4.0+2

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  
  # Documentation
  dartdoc: ^9.0.0
  
  # Custom Lint Rules
  custom_lint: 0.8.1
  dependency_lint_rules:
    path: tools/lint_rules

  # Code Generation
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.0+1
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.3
  http_mock_adapter: ^0.6.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher_adaptive_fore.png"
  adaptive_icon_background: "#448AFF"
  adaptive_icon_foreground: "assets/images/ic_launcher_adaptive_fore.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/v1/delete/user/
    - assets/mock/v1/get/
    - assets/mock/v1/post/
    - assets/mock/v1/post/auth/
    - assets/mock/v1/post/user/
    - assets/mock/images/

