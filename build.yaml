targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Generate copyWith, ==, hashCode, toString
          union: true
          map: true
      json_serializable:
        enabled: true
        options:
          any_map: true
          checked: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
      riverpod_generator:
        enabled: true
      retrofit_generator:
        enabled: true
