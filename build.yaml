targets:
  $default:
    builders:
      freezed:
        enabled: true
        generate_for:
          - lib/**
        options:
          union: true
          map: true
      json_serializable:
        enabled: true
        generate_for:
          - lib/**
        options:
          any_map: true
          checked: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
      riverpod_generator:
        enabled: true
        generate_for:
          - lib/**
      retrofit_generator:
        enabled: true
        generate_for:
          - lib/**
