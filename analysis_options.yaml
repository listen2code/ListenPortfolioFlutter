# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# Enable custom lint rules
analyzer:
  plugins:
    - custom_lint
  exclude:
    - "build/**"                  # Exclude build artifacts
    - "**/*.g.dart"               # Exclude generated files (build_runner)
    - "**/*.freezed.dart"         # Exclude Freezed generated files
    - "**/generated/**"           # Exclude all generated content directories
    - "tools/lint_rules/**"       # Exclude custom lint rules (temporarily disabled)
    - "tools/dependency_rules.dart" # Exclude dependency rules tool (uses print statements)
    - "test/**"                   # Exclude test files (have various lint issues)
    - "lib/shared/theme/setting_provider.dart"         # Exclude provider with event bus issues
    - "lib/shared/utils/app_initializer.dart"           # Exclude initializer with core issues
  
  language:
    strict-casts: true            # Enable strict type casting checks
    strict-inference: true        # Enable strict type inference
    strict-raw-types: true        # Enable strict raw type checks

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

custom_lint:
  rules:
    - use_common_image
    - use_common_clickable
    - use_common_text
    - use_common_button
    - use_common_icon_button
    - use_common_dialog
    - use_common_switch
    - use_common_text_field
    - use_common_refresh_list
    - view_model_context_isolation
    - cross_feature_relative_import
    - no_hardcoded_strings
    - no_raw_color
    - no_direct_state_assignment
    - no_direct_app_nav_usage

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # Dependency boundary rules
    - avoid_relative_lib_imports        # Avoid importing files from lib/ directory using relative paths
    - prefer_relative_imports           # Prefer relative imports for files within the same package
    - implementation_imports            # Avoid importing implementation files from another package
    - depend_on_referenced_packages     # Ensure all referenced packages are listed in pubspec.yaml
    
    # Code quality rules
    - avoid_print                       # Avoid using print statements in production code
    - prefer_single_quotes              # Use single quotes for strings unless they contain single quotes
    - prefer_final_fields               # Prefer final for class fields that are only set once
    - prefer_final_locals               # Prefer final for local variables that are not reassigned
    - prefer_const_constructors         # Prefer const constructors for creating immutable objects
    - prefer_const_literals_to_create_immutables  # Prefer const literals for creating immutable collections
    - unnecessary_const                 # Avoid unnecessary const keywords
    - unnecessary_new                   # Avoid unnecessary new keywords
    - prefer_is_empty                   # Prefer isEmpty() to check if collections are empty
    - prefer_is_not_empty               # Prefer isNotEmpty() to check if collections are not empty
    - avoid_unnecessary_containers      # Avoid wrapping widgets in unnecessary Container widgets
    - sized_box_for_whitespace          # Use SizedBox instead of Container for adding whitespace
    - use_key_in_widget_constructors    # Use Key parameter in widget constructors for better widget identification
    
    # Architecture-related rules
    - one_member_abstracts              # Prefer typedefs over single-method abstract classes
    - avoid_classes_with_only_static_members  # Avoid classes that only contain static members
    - type_init_formals                 # Use type initialization formals for constructor parameters
    - cascade_invocations               # Use cascade invocations for chaining method calls
    - join_return_with_assignment       # Join return statement with assignment when possible

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
