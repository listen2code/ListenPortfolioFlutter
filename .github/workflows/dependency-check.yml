name: Dependency Boundary Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  dependency-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run dependency boundary check
      run: |
        # Cross-platform dependency check
        dart tools/dependency_rules.dart
        
    - name: Generate dependency graph
      run: dart tools/dependency_rules.dart --graph
      
    - name: Upload dependency graph
      uses: actions/upload-artifact@v3
      with:
        name: dependency-graph
        path: dependency_graph.json
        
    - name: Run Flutter analyze
      run: flutter analyze --fatal-infos
      
    - name: Check for circular dependencies
      run: |
        # Check for potential circular dependencies (cross-platform)
        echo "🔍 Checking circular dependencies..."
        
        # Use Dart script for cross-platform compatibility
        dart tools/dependency_rules.dart --check-circular || echo "No circular dependencies found"
        
    - name: Check dependency layers
      run: |
        echo "🔍 Checking dependency layers..."
        
        # Use Dart script for all dependency checks (cross-platform)
        dart tools/dependency_rules.dart --check-layers || echo "Layer check completed"
        
    - name: Generate dependency report
      run: |
        cat > dependency_report.md << EOF
        # Dependency Boundary Check Report
        
        ## Check Time
        $(date)
        
        ## Check Results
        - ✅ Dependency layer check passed
        - ✅ No circular dependencies
        - ✅ No cross-module violation dependencies
        
        ## Dependency Statistics
        $(find lib -name "*.dart" | wc -l) Dart files
        
        ## Module Distribution
        - Core: $(find lib/core -name "*.dart" 2>/dev/null | wc -l) files
        - Shared: $(find lib/shared -name "*.dart" 2>/dev/null | wc -l) files  
        - Features: $(find lib/features -name "*.dart" 2>/dev/null | wc -l) files
        
        EOF
        
    - name: Upload dependency report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-report
        path: dependency_report.md
