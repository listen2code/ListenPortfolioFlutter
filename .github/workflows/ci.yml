name: CI and APK Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment'
        required: true
        default: 'mock'
        type: choice
        options:
          - mock
          - dev
          - test
          - prod
      force_build_apk:
        description: 'Force build APK even if conditions not met'
        required: false
        default: false
        type: boolean

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    outputs:
      should_build_apk: ${{ steps.check.outputs.should_build_apk }}
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check build conditions
        id: check
        run: |
          # Initialize variables
          SHOULD_BUILD_APK="false"
          ENVIRONMENT="mock"
          
          # Check if force build
          if [[ "${{ github.event.inputs.force_build_apk }}" == "true" ]]; then
            SHOULD_BUILD_APK="true"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            echo "Force build requested"
          fi
          
          # Check commit message for build triggers using a safer approach
          if [[ "$SHOULD_BUILD_APK" == "false" ]]; then
            # Get commit message safely
            COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
            # Check for build triggers using simple string operations
            if [[ "$COMMIT_MSG" == *"[build-apk]"* ]] || [[ "$COMMIT_MSG" == *"[apk]"* ]] || [[ "$COMMIT_MSG" == *"[deploy]"* ]]; then
              SHOULD_BUILD_APK="true"
              echo "Build trigger found in commit message"
            fi
          fi
          
          # Check if manual trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "$SHOULD_BUILD_APK" == "false" ]]; then
            SHOULD_BUILD_APK="true"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            echo "Manual workflow dispatch"
          fi
          
          # Check if PR
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "$SHOULD_BUILD_APK" == "false" ]]; then
            SHOULD_BUILD_APK="true"
            echo "Pull request trigger"
          fi
          
          # Check time interval for push events
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "$SHOULD_BUILD_APK" == "false" ]]; then
            echo "Checking last build time..."
          
            # Get last successful build time
            LAST_BUILD=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=push&status=success&per_page=1" | \
              jq -r '.workflow_runs[0].created_at // ""')
          
            if [[ -n "$LAST_BUILD" ]] && [[ "$LAST_BUILD" != "null" ]]; then
              CURRENT_TIME=$(date -u +%s)
              LAST_BUILD_TIME=$(date -d "$LAST_BUILD" -u +%s 2>/dev/null || echo 0)
              TIME_DIFF=$(( (CURRENT_TIME - LAST_BUILD_TIME) / 3600 ))
          
              echo "Last build: $LAST_BUILD"
              echo "Time difference: $TIME_DIFF hours"
          
              if [[ $TIME_DIFF -ge 2 ]]; then
                SHOULD_BUILD_APK="true"
                echo "Building due to time interval"
              fi
            else
              SHOULD_BUILD_APK="true"
              echo "No previous build found"
            fi
          fi
          
          echo "should_build_apk=$SHOULD_BUILD_APK" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "Build condition result: $SHOULD_BUILD_APK"


  build-apk:
    needs: [check-conditions]
    if: needs.check-conditions.outputs.should_build_apk == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: 'true'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version.json
        run: dart run tools/generate_version_json.dart

      - name: Verify Java installation
        run: |
          echo "=== Java Verification ==="
          echo "Java version:"
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Which java: $(which java)"
          echo "Java home directory:"
          ls -la $JAVA_HOME 2>/dev/null || echo "JAVA_HOME directory not found"
          echo "Available Java installations:"
          ls -la /usr/lib/jvm/ 2>/dev/null || echo "No JVM directory found"
          echo "========================"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${{ needs.check-conditions.outputs.environment }}"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

      - name: Create Keystore Directory
        run: mkdir -p android/keystore

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/key.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore/keystore.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Set up google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 secret is not configured!"
            exit 1
          fi
          echo "Decoding real google-services.json from secret..."
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build APK via script
        run: |
          sed -i 's/\r$//' buildAndroid.sh
          chmod +x buildAndroid.sh
          ./buildAndroid.sh apk ${{ steps.env.outputs.environment }}

      - name: Get APK info
        id: apk_info
        run: |
          APK_FILE=$(find apkOutput -name "*.apk" | head -n 1)
          if [[ -n "$APK_FILE" ]]; then
            FILENAME=$(basename "$APK_FILE")
            SIZE=$(stat -c%s "$APK_FILE")
            echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
            echo "apk_filename=$FILENAME" >> $GITHUB_OUTPUT
            echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "No APK file found"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lPortfolio-${{ steps.env.outputs.environment }}-apk
          path: ${{ steps.apk_info.outputs.apk_file }}
          retention-days: 30

      - name: Generate download info
        run: |
          cat > download_info.md << EOF
          # APK Download Information
          
          ## Build Details
          - Environment: ${{ steps.env.outputs.environment }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Build Time: $(date)
          - Trigger: ${{ github.event_name }}
          - Build Type: Debug (No signing required)
          
          ## APK Information
          - File Name: ${{ steps.apk_info.outputs.apk_filename }}
          - File Size: ${{ steps.apk_info.outputs.apk_size }} bytes
          - Version: $(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          
          ## Download Options
          
          ### 1. GitHub Actions Artifact (Recommended)
          - Go to Actions Tab in your GitHub repository
          - Find this workflow run
          - Click on Artifacts section
          - Download: lPortfolio-${{ steps.env.outputs.environment }}-apk
          
          ### 2. Direct Download Link (Temporary)
          The artifact will be available for download from the Actions page for 30 days.
          
          ## Installation Instructions
          
          1. Download the APK file from the GitHub Actions artifacts
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK file
          
          ## Important Notes
          
          - This is a **DEBUG** build for testing purposes
          - **Optimized for arm64-v8a architecture only** (smaller size, faster build)
          - No signing required - can be installed directly
          - Not suitable for production use
          - Contains debug symbols and logging
          
          ## Architecture Compatibility
          
          - **Compatible with**: Most modern Android devices (64-bit ARM)
          - **Not compatible with**: Older 32-bit ARM devices
          - **Recommended for**: Development and testing on modern devices
          
          Environment: ${{ steps.env.outputs.environment }}
          EOF

      - name: Upload download info
        uses: actions/upload-artifact@v4
        with:
          name: download-info-${{ steps.env.outputs.environment }}
          path: download_info.md
          retention-days: 30

      - name: Comment PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const downloadInfo = fs.readFileSync('download_info.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 APK Ready for Download\n\n${downloadInfo}\n\n---\n🤖 This comment was automatically generated by the build workflow.`
            });

      - name: Create Release (for main branch pushes)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Build ${{ github.run_number }} - ${{ steps.env.outputs.environment }}
          body: |
            ## 📱 APK Build Available
            
            **Environment**: ${{ steps.env.outputs.environment }}
            **Version**: $(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
            **Commit**: ${{ github.sha }}
            
            ### Download
            - APK file is available in the artifacts section below
            - File: ${{ steps.apk_info.outputs.apk_filename }}
            - Size: ${{ steps.apk_info.outputs.apk_size }} bytes
            
            ### Installation
            1. Download the APK from the artifacts
            2. Install on your Android device
            
            ---
            🤖 This release was automatically created.
          draft: false
          prerelease: true

  update-version-json:
    needs: [check-conditions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate version.json
        run: dart run tools/generate_version_json.dart
      - name: Commit and Push version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/version.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-generate version.json [skip ci]"
            git pull origin ${{ github.ref_name }} --rebase -X theirs
            git push origin ${{ github.ref_name }}
          fi
  deploy-to-google-play:
    needs: [check-conditions, update-version-json]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ needs.check-conditions.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.check-conditions.outputs.environment }}

    steps:
      - name: Checkout code (with latest version.json)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: 'true'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Install dependencies
        run: flutter pub get

      - name: Create Keystore Directory
        run: mkdir -p android/keystore

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/key.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore/keystore.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Set up google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 secret is not configured!"
            exit 1
          fi
          echo "Decoding real google-services.json from secret..."
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Check if Version Already Uploaded
        id: check_version
        env:
          PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          # Get latest version code from Google Play
          LATEST_VERSION_CODE=$(node tools/get_play_version.js)
          echo "Latest version code on Google Play: $LATEST_VERSION_CODE"
          NEXT_VERSION_CODE=$(( LATEST_VERSION_CODE + 1 ))
          echo "Next Version Code required by Google Play: $NEXT_VERSION_CODE"
          
          # Get version name from pubspec.yaml
          VNAME=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "Version name in pubspec.yaml: $VNAME"
          
          # Calculate project version code (major*10000 + minor*100 + patch)
          IFS='.' read -r -a parts <<< "$VNAME"
          major=${parts[0]:-0}
          minor=${parts[1]:-0}
          patch=$(echo "${parts[2]:-0}" | tr -cd '0-9')
          PROJECT_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          echo "Calculated Project Version Code: $PROJECT_VERSION_CODE"
          
          if [ $PROJECT_VERSION_CODE -lt $NEXT_VERSION_CODE ]; then
            echo "Current version code $PROJECT_VERSION_CODE has already been used on Google Play (latest is $LATEST_VERSION_CODE)."
            echo "Skipping deployment..."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "Current version code $PROJECT_VERSION_CODE is valid."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Release AAB via script
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          sed -i 's/\r$//' buildAndroid.sh
          chmod +x buildAndroid.sh
          ./buildAndroid.sh bundle ${{ env.ENVIRONMENT }}

      - name: Upload to Google Play Internal
        if: steps.check_version.outputs.should_deploy == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.listen.portfolio.listen_portfolio_flutter
          releaseFiles: apkOutput/lPortfolio-${{ env.ENVIRONMENT }}-release.aab
          tracks: internal
          status: completed

      - name: Send Version Update Push Notification
        if: steps.check_version.outputs.should_deploy == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          node tools/send_push_notification.js --link listen://settings?check_update=true


  skip-build:
    needs: check-conditions
    if: needs.check-conditions.outputs.should_build_apk == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip APK build notification
        run: |
          echo "APK build skipped"
          echo "Reason: Build conditions not met"
          echo "Time since last build: < 2 hours"
          echo "No build trigger found in commit message"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "To force APK build, use one of these methods:"
          echo "1. Add [build-apk], [apk], or [deploy] to commit message"
          echo "2. Wait 2+ hours since last build"
          echo "3. Use manual workflow dispatch"