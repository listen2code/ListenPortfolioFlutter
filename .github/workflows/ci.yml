name: CI and APK Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment'
        required: true
        default: 'mock'
        type: choice
        options:
        - mock
        - dev
        - test
        - prod
      force_build_apk:
        description: 'Force build APK even if conditions not met'
        required: false
        default: false
        type: boolean

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    outputs:
      should_build_apk: ${{ steps.check.outputs.should_build_apk }}
      environment: ${{ steps.check.outputs.environment }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check build conditions
      id: check
      run: |
        # Initialize variables
        SHOULD_BUILD_APK="true"
        ENVIRONMENT="mock"
        
        # Check if force build
        if [[ "${{ github.event.inputs.force_build_apk }}" == "true" ]]; then
          SHOULD_BUILD_APK="true"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          echo "Force build requested"
        fi
        
        # Check commit message for build triggers using a safer approach
        if [[ "$SHOULD_BUILD_APK" == "false" ]]; then
          # Get commit message safely
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
          # Check for build triggers using simple string operations
          if [[ "$COMMIT_MSG" == *"[build-apk]"* ]] || [[ "$COMMIT_MSG" == *"[apk]"* ]] || [[ "$COMMIT_MSG" == *"[deploy]"* ]]; then
            SHOULD_BUILD_APK="true"
            echo "Build trigger found in commit message"
          fi
        fi
        
        # Check if manual trigger
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "$SHOULD_BUILD_APK" == "false" ]]; then
          SHOULD_BUILD_APK="true"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          echo "Manual workflow dispatch"
        fi
        
        # Check if PR
        if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "$SHOULD_BUILD_APK" == "false" ]]; then
          SHOULD_BUILD_APK="true"
          echo "Pull request trigger"
        fi
        
        # Check time interval for push events
        if [[ "${{ github.event_name }}" == "push" ]] && [[ "$SHOULD_BUILD_APK" == "false" ]]; then
          echo "Checking last build time..."
          
          # Get last successful build time
          LAST_BUILD=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=push&status=success&per_page=1" | \
            jq -r '.workflow_runs[0].created_at // ""')
          
          if [[ -n "$LAST_BUILD" ]] && [[ "$LAST_BUILD" != "null" ]]; then
            CURRENT_TIME=$(date -u +%s)
            LAST_BUILD_TIME=$(date -d "$LAST_BUILD" -u +%s 2>/dev/null || echo 0)
            TIME_DIFF=$(( (CURRENT_TIME - LAST_BUILD_TIME) / 3600 ))
            
            echo "Last build: $LAST_BUILD"
            echo "Time difference: $TIME_DIFF hours"
            
            if [[ $TIME_DIFF -ge 2 ]]; then
              SHOULD_BUILD_APK="true"
              echo "Building due to time interval"
            fi
          else
            SHOULD_BUILD_APK="true"
            echo "No previous build found"
          fi
        fi
        
        echo "should_build_apk=$SHOULD_BUILD_APK" >> $GITHUB_OUTPUT
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "Build condition result: $SHOULD_BUILD_APK"

  flutter-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Setup test environment
      run: |
        echo "Setting up test environment..."
        # Install required packages for coverage analysis
        sudo apt-get update
        sudo apt-get install -y lcov bc
        # Ensure test assets are available
        mkdir -p assets/mock/v1/get
        mkdir -p assets/mock/v1/post
        echo "Test environment setup completed"
        
    - name: Run unit tests with coverage
      run: |
        echo "Running Flutter unit tests..."
        flutter test --coverage --reporter=expanded
        
        echo "Generating coverage report..."
        genhtml coverage/lcov.info -o coverage/html --quiet --ignore-errors source
        
        echo "Test coverage summary:"
        lcov --summary coverage/lcov.info
        
    - name: Run widget tests
      run: |
        echo "Running Flutter widget tests..."
        flutter test --reporter=expanded test/features/home/projects/projects_widget_test.dart
        
    - name: Run integration tests (if any)
      run: |
        echo "Checking for integration tests..."
        if [ -d "integration_test" ]; then
          echo "Found integration tests, running..."
          flutter test integration_test/ --reporter=expanded
        else
          echo "No integration tests found, skipping..."
        fi
        
    - name: Analyze test coverage
      run: |
        echo "Analyzing test coverage..."
        
        # Extract coverage percentage
        COVERAGE_PERCENT=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines......:" | awk '{print $2}' | sed 's/%//')
        
        echo "Current coverage: ${COVERAGE_PERCENT}%"
        
        # Check if coverage meets minimum threshold (60% as mentioned in TODO)
        MIN_COVERAGE=60
        if (( $(echo "$COVERAGE_PERCENT >= $MIN_COVERAGE" | bc -l) )); then
          echo "Coverage check passed: ${COVERAGE_PERCENT}% >= ${MIN_COVERAGE}%"
        else
          echo "Coverage check failed: ${COVERAGE_PERCENT}% < ${MIN_COVERAGE}%"
          echo "Consider adding more tests to meet the minimum coverage requirement"
          # Note: Don't fail the build for now, just warn
        fi
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage/lcov.info
          coverage/html/
        retention-days: 30
        
    - name: Upload coverage to Codecov (optional)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      uses: codecov/codecov-action@v4
      with:
        file: coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  dependency-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run dependency boundary check
      run: |
        echo "Starting dependency boundary analysis..."
        if [ -f "tools/dependency_rules.dart" ]; then
          echo "dependency_rules.dart found"
          dart tools/dependency_rules.dart
          if [ $? -ne 0 ]; then
            echo "Dependency boundary check failed"
            exit 1
          fi
          echo "Dependency boundary check passed"
        else
          echo "dependency_rules.dart not found"
          exit 1
        fi
        
    - name: Generate dependency graph
      run: |
        echo "Generating dependency graph..."
        dart tools/dependency_rules.dart --graph
        
    - name: Upload dependency graph
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-graph
        path: dependency_graph.json
        retention-days: 30
        
    - name: Run Flutter analyze
      run: |
        echo "Running Flutter analyze..."
        flutter analyze --no-fatal-infos --no-fatal-warnings
        echo "Flutter analyze completed successfully"

  build-apk:
    needs: [check-conditions, flutter-test, dependency-analysis]
    if: needs.check-conditions.outputs.should_build_apk == 'true' && needs.flutter-test.result == 'success' && needs.dependency-analysis.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        cache: 'true'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Verify Java installation
      run: |
        echo "=== Java Verification ==="
        echo "Java version:"
        java -version
        echo "JAVA_HOME: $JAVA_HOME"
        echo "Which java: $(which java)"
        echo "Java home directory:"
        ls -la $JAVA_HOME 2>/dev/null || echo "JAVA_HOME directory not found"
        echo "Available Java installations:"
        ls -la /usr/lib/jvm/ 2>/dev/null || echo "No JVM directory found"
        echo "========================"
      
    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        else
          ENV="${{ needs.check-conditions.outputs.environment }}"
        fi
        echo "environment=$ENV" >> $GITHUB_OUTPUT
        
    - name: Build Debug APK
      run: |
        echo "Building debug APK for ${{ steps.env.outputs.environment }} environment"
        
        # Find the correct Java home directory
        JAVA_HOME_DIR=$(dirname $(dirname $(readlink -f $(which java))))
        echo "Found Java home: $JAVA_HOME_DIR"
        
        # Set environment variables for GitHub Actions
        export JAVA_HOME="$JAVA_HOME_DIR"
        export ANDROID_HOME="/usr/local/lib/android/sdk"
        export PATH="$JAVA_HOME/bin:$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$PATH"
        
        # Create output directory
        mkdir -p apkOutput
        
        # Build debug APK with single architecture (arm64-v8a) for faster build and smaller size
        echo "Building debug APK with arm64-v8a architecture only..."
        flutter build apk --debug \
          --target-platform android-arm64 \
          --dart-define=APP_ENV=${{ steps.env.outputs.environment }} \
          --dart-define=APP_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
        
        # Find and copy the built APK
        APK_FILE=$(find build/app/outputs/flutter-apk -name "app-debug.apk" | head -n 1)
        if [[ -n "$APK_FILE" ]]; then
          cp "$APK_FILE" "apkOutput/lPortfolio-${{ steps.env.outputs.environment }}-debug-arm64.apk"
          echo ">>> Build successful. Output: apkOutput/lPortfolio-${{ steps.env.outputs.environment }}-debug-arm64.apk"
          echo ">>> File size: $(du -h apkOutput/lPortfolio-${{ steps.env.outputs.environment }}-debug-arm64.apk | cut -f1)"
        else
          echo ">>> Error: APK file not found"
          echo ">>> Build directory contents:"
          find build -name "*.apk" 2>/dev/null || echo "No APK files found"
          exit 1
        fi
        
    - name: Get APK info
      id: apk_info
      run: |
        APK_FILE=$(find apkOutput -name "*.apk" | head -n 1)
        if [[ -n "$APK_FILE" ]]; then
          FILENAME=$(basename "$APK_FILE")
          SIZE=$(stat -c%s "$APK_FILE")
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
        else
          echo "No APK file found"
          exit 1
        fi
        
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lPortfolio-${{ steps.env.outputs.environment }}-apk
        path: ${{ steps.apk_info.outputs.apk_file }}
        retention-days: 30
        
    - name: Generate download info
      run: |
        cat > download_info.md << EOF
        # APK Download Information
        
        ## Build Details
        - Environment: ${{ steps.env.outputs.environment }}
        - Branch: ${{ github.ref_name }}
        - Commit: ${{ github.sha }}
        - Build Time: $(date)
        - Trigger: ${{ github.event_name }}
        - Build Type: Debug (No signing required)
        
        ## APK Information
        - File Name: ${{ steps.apk_info.outputs.apk_filename }}
        - File Size: ${{ steps.apk_info.outputs.apk_size }} bytes
        - Version: $(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
        
        ## Download Options
        
        ### 1. GitHub Actions Artifact (Recommended)
        - Go to Actions Tab in your GitHub repository
        - Find this workflow run
        - Click on Artifacts section
        - Download: lPortfolio-${{ steps.env.outputs.environment }}-apk
        
        ### 2. Direct Download Link (Temporary)
        The artifact will be available for download from the Actions page for 30 days.
        
        ## Installation Instructions
        
        1. Download the APK file from the GitHub Actions artifacts
        2. Enable "Install from unknown sources" on your Android device
        3. Install the APK file
        
        ## Important Notes
        
        - This is a **DEBUG** build for testing purposes
        - **Optimized for arm64-v8a architecture only** (smaller size, faster build)
        - No signing required - can be installed directly
        - Not suitable for production use
        - Contains debug symbols and logging
        
        ## Architecture Compatibility
        
        - **Compatible with**: Most modern Android devices (64-bit ARM)
        - **Not compatible with**: Older 32-bit ARM devices
        - **Recommended for**: Development and testing on modern devices
        
        Environment: ${{ steps.env.outputs.environment }}
        EOF
        
    - name: Upload download info
      uses: actions/upload-artifact@v4
      with:
        name: download-info-${{ steps.env.outputs.environment }}
        path: download_info.md
        retention-days: 30
        
    - name: Comment PR with download link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const downloadInfo = fs.readFileSync('download_info.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📱 APK Ready for Download\n\n${downloadInfo}\n\n---\n🤖 This comment was automatically generated by the build workflow.`
          });
          
    - name: Create Release (for main branch pushes)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ github.run_number }}
        release_name: Build ${{ github.run_number }} - ${{ steps.env.outputs.environment }}
        body: |
          ## 📱 APK Build Available
          
          **Environment**: ${{ steps.env.outputs.environment }}
          **Version**: $(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          **Commit**: ${{ github.sha }}
          
          ### Download
          - APK file is available in the artifacts section below
          - File: ${{ steps.apk_info.outputs.apk_filename }}
          - Size: ${{ steps.apk_info.outputs.apk_size }} bytes
          
          ### Installation
          1. Download the APK from the artifacts
          2. Install on your Android device
          
          ---
          🤖 This release was automatically created.
        draft: false
        prerelease: true

  deploy-to-google-play:
    needs: [flutter-test, dependency-analysis]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        cache: 'true'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Create Keystore Directory
      run: mkdir -p android/keystore
      
    - name: Decode Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/key.jks
        
    - name: Create keystore.properties
      run: |
        cat > android/keystore/keystore.properties << EOF
        storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
        storeFile=key.jks
        EOF
        
    - name: Build Release AAB
      run: |
        flutter build appbundle --release \
          --dart-define=APP_ENV=prod
          
    - name: Upload to Google Play Internal
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        packageName: com.listen.portfolio.listen_portfolio_flutter
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        track: internal
        status: completed
        
  skip-build:
    needs: check-conditions
    if: needs.check-conditions.outputs.should_build_apk == 'false'
    runs-on: ubuntu-latest
    steps:
    - name: Skip APK build notification
      run: |
        echo "APK build skipped"
        echo "Reason: Build conditions not met"
        echo "Time since last build: < 2 hours"
        echo "No build trigger found in commit message"
        echo "Commit: ${{ github.sha }}"
        echo ""
        echo "To force APK build, use one of these methods:"
        echo "1. Add [build-apk], [apk], or [deploy] to commit message"
        echo "2. Wait 2+ hours since last build"
        echo "3. Use manual workflow dispatch"
